name: CI & Extension Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests & Benchmarks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Solver Unit Test Suite
        run: node tests/solver.test.js

      - name: Run Solver Performance Benchmark
        run: node tests/benchmark.js

  validate-and-package:
    name: Validate Manifest & Package Extension
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate Manifest V3 Syntax
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('Must be Manifest V3');
            if (!manifest.name || !manifest.version) throw new Error('Missing name or version');
            console.log('✅ Manifest V3 validated: ' + manifest.name + ' v' + manifest.version);
          "

      - name: Create Unpacked Distribution Bundle
        run: |
          mkdir -p dist
          zip -r dist/linkedin-zip-solver-v1.0.0.zip \
            manifest.json \
            background.js \
            content.js \
            content.css \
            dom-bridge.js \
            solver.js \
            popup.html \
            popup.css \
            popup.js \
            playground.html \
            playground.css \
            playground.js \
            icons/ \
            README.md \
            LICENSE

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-zip-solver-chrome-extension
          path: dist/linkedin-zip-solver-v1.0.0.zip
          retention-days: 30
