name: Release Extension Package

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Extension ZIP
        run: |
          mkdir -p dist
          zip -r dist/linkedin-zip-puzzle-solver-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            content.js \
            content.css \
            dom-bridge.js \
            solver.js \
            popup.html \
            popup.css \
            popup.js \
            playground.html \
            playground.css \
            playground.js \
            icons/ \
            README.md \
            LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/linkedin-zip-puzzle-solver-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
