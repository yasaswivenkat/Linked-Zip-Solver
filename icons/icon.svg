<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="zipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded container -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4"/>
  
  <!-- Subtle grid dots in background -->
  <circle cx="36" cy="36" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="64" cy="36" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="92" cy="36" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="36" cy="64" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="64" cy="64" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="92" cy="64" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="36" cy="92" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="64" cy="92" r="2" fill="#38bdf8" opacity="0.3"/>
  <circle cx="92" cy="92" r="2" fill="#38bdf8" opacity="0.3"/>

  <!-- Stylized Zip path / lightning line -->
  <path d="M 32 38 L 94 38 L 34 90 L 96 90" 
        fill="none" 
        stroke="url(#zipGrad)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Waypoint numbered nodes -->
  <!-- Node 1 -->
  <circle cx="32" cy="38" r="9" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="32" cy="38" r="4" fill="#ffffff"/>
  
  <!-- Node 2 -->
  <circle cx="64" cy="64" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="64" cy="64" r="3.5" fill="#38bdf8"/>

  <!-- Node 3 -->
  <circle cx="96" cy="90" r="9" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
  <circle cx="96" cy="90" r="4" fill="#ffffff"/>
</svg>
